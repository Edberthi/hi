<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Website</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
  }

  header {
    padding: 20px;
    background: #1f1f1f;
  }

  h1 {
    color: #00ffcc;
  }

  .stickman {
    margin: 40px auto;
  }

  /* Stickman drawing */
  .head {
    width: 60px;
    height: 60px;
    border: 4px solid white;
    border-radius: 50%;
    margin: auto;
  }

  .body {
    width: 4px;
    height: 80px;
    background: white;
    margin: auto;
  }

  .arms {
    width: 100px;
    height: 4px;
    background: white;
    margin: auto;
    position: relative;
    top: -60px;
  }

  .legs {
    width: 80px;
    height: 4px;
    background: white;
    margin: auto;
    position: relative;
    top: 20px;
    transform: rotate(30deg);
  }

  .legs::after {
    content: "";
    position: absolute;
    width: 80px;
    height: 4px;
    background: white;
    transform: rotate(-60deg);
    left: 0;
  }

  .card {
    background: #1a1a1a;
    margin: 20px;
    padding: 20px;
    border-radius: 10px;
  }

  button {
    padding: 10px 20px;
    border: none;
    background: #00ffcc;
    color: black;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>

<body>

<header>
  <h1>🧍 Stickman World</h1>
  <p>Welcome to my simple website</p>
</header>

<div class="stickman">
  <div class="head"></div>
  <div class="body"></div>
  <div class="arms"></div>
  <div class="legs"></div>
</div>

<div class="card">
  <h2>Hello 👋</h2>
  <p>This is a simple stickman website using only HTML & CSS.</p>
  <button onclick="hello()">Click Me</button>
</div>

<script>
function hello(){
  alert("Hello from Stickman 😎");
}
</script>

</body>
</html>
