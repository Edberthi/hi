<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Showcase</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f2027;
  color: white;
  text-align: center;
}

/* HEADER */
header {
  padding: 20px;
}

/* IMAGE FOCUS */
.image-box {
  margin: 20px auto;
}

.image-box img {
  width: 80%;
  max-width: 400px;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(0,255,200,0.6);
  transition: 0.3s;
}

.image-box img:hover {
  transform: scale(1.05);
}

/* STICKMAN */
.stickman {
  position: relative;
  width: 100%;
  height: 150px;
  margin-top: 30px;
  overflow: hidden;
}

/* walking animation */
.walk {
  position: absolute;
  left: -100px;
  animation: walkMove 6s linear infinite;
}

/* move across screen */
@keyframes walkMove {
  0% { left: -100px; }
  100% { left: 100%; }
}

/* body parts */
.head {
  width: 40px;
  height: 40px;
  border: 3px solid white;
  border-radius: 50%;
  margin: auto;
}

.body {
  width: 3px;
  height: 50px;
  background: white;
  margin: auto;
}

/* arms swing */
.arms {
  width: 60px;
  height: 3px;
  background: white;
  margin: auto;
  animation: swing 0.5s infinite alternate;
}

@keyframes swing {
  from { transform: rotate(20deg); }
  to { transform: rotate(-20deg); }
}

/* legs walking */
.legs {
  width: 40px;
  height: 3px;
  background: white;
  margin: auto;
  animation: walkLeg 0.5s infinite alternate;
}

.legs::after {
  content: "";
  position: absolute;
  width: 40px;
  height: 3px;
  background: white;
  animation: walkLeg2 0.5s infinite alternate;
}

@keyframes walkLeg {
  from { transform: rotate(20deg); }
  to { transform: rotate(-20deg); }
}

@keyframes walkLeg2 {
  from { transform: rotate(-20deg); }
  to { transform: rotate(20deg); }
}

/* CARD */
.card {
  margin: 20px;
  padding: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
}

button {
  padding: 10px 20px;
  border: none;
  background: #00ffd5;
  color: black;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <h1>🧍 Stickman Showcase</h1>
  <p>My Highlight Image</p>
</header>

<!-- IMAGE -->
<div class="image-box">
  <img src="Screenshot_20260321-212307.jpg" alt="My Image">
</div>

<!-- STICKMAN WALK -->
<div class="stickman">
  <div class="walk">
    <div class="head"></div>
    <div class="body"></div>
    <div class="arms"></div>
    <div class="legs"></div>
  </div>
</div>

<!-- CONTENT -->
<div class="card">
  <h2>Hello</h2>
  <p>This is stickman</p>
  <button onclick="hello()">Click Me</button>
</div>

<script>
function hello(){
  alert("Nice image 🔥");
}
</script>

</body>
</html>
